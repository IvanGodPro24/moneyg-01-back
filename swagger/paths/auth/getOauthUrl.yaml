tags:
  - Auth
security: []
summary: Get oauth url
operationId: getOauthUrl
description: Get url for google oauth
responses:
  '200':
    description: Successfully get oauth url
    content:
      application/json:
        schema:
          type: object
          required:
            - message
            - url
          properties:
            message:
              type: string
              example: Successfully get Google OAuth url!
            url:
              type: string
              example: 'https://accounts.google.com/o/oauth2/v2/auth?scope=https%3A%2F%2Fwww.googleapis.com%2Fauth%2Fuserinfo.email%20https%3A%2F%2Fwww.googleapis.com%2Fauth%2Fuserinfo.profile&response_type=code&client_id=604858898889-di9goki8qjeik6jhrfptschom1veuq5g.apps.googleusercontent.com&redirect_uri=http%3A%2F%2Flocalhost%3A5173%2Fconfirm-google-auth'
  '400':
    $ref: ../../components/responses/400.yaml
  '500':
    $ref: ../../components/responses/500.yaml
