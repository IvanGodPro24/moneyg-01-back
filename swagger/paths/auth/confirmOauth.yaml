tags:
  - Auth
security: []
summary: Confirm oauth
operationId: confirmOauth
description: Confirm google oauth
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - code
        properties:
          code:
            type: string
            example: '4/0AVMBsJgGLWkGNl7rnbv2xn8cKeFSAgziVwKZAja5iWudIprb8zQ2wqTKcFh4zr62k-TvEw'
responses:
  '200':
    description: Successfully user login via google oauth
    content:
      application/json:
        schema:
          type: object
          required:
            - user
            - token
          properties:
            user:
              type: object
              $ref: '../../components/schemas/user.yaml'
            token:
              type: string
              example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjY4MDdkZDA3NDE3NmIyNmI2NzhmNDcxYSIsImlhdCI6MTc0NTM5OTk5OSwiZXhwIjoxNzQ1NDg2Mzk5fQ.SO0oSy_qAwmBBYuNciENTjefeojFS5fbmF-tishRyxQ'
  '400':
    $ref: ../../components/responses/400.yaml
  '500':
    $ref: ../../components/responses/500.yaml
