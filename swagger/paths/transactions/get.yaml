tags:
  - Transactions
summary: Get all transactions
description: Get all transactions in collection for the authenticated user.
operationId: getTransactions
security:
  - bearerAuth: []
responses:
  '200':
    description: Successfully found transactions
    content:
      application/json:
        schema:
          type: object
          required:
            - data
            - page
            - perPage
            - totalItems
            - totalPages
            - hasNextPage
            - hasPreviousPage
          properties:
            data:
              $ref: '../../components/schemas/transaction.yaml'
            page:
              type: number
              example: 2
            perPage:
              type: number
              example: 10
            totalItems:
              type: number
              example: 30
            totalPages:
              type: number
              example: 4
            hasNextPage:
              type: boolean
              example: true
            hasPreviousPage:
              type: boolean
              example: false
  '401':
    $ref: '../../components/responses/401.yaml'
  '404':
    $ref: '../../components/responses/404.yaml'
