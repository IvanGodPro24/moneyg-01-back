tags:
  - User
security:
  - bearerAuth: []
summary: Update user information
operationId: updateUser
description: Update specific fields of the current user. Requires authorization token.
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "User's name"
            type: string
            example: 'John Doe'
          email:
            description: "User's email"
            type: string
            format: email
            maxLength: 64
            example: 'test@example.com'
          password:
            description: "User's password"
            type: string
            example: 'qwerty1234'
          balance:
            description: "User's current balance"
            type: number
            format: float
            example: 0
          avatarURL:
            description: "User's avatar"
            type: string
            example: https://res.cloudinary.com/dhopmpvmg/image/upload/v1749401010/avatars/oozxynlcfdudmkgisovl.png
          registrationDate:
            type: string
            description: Registration date
            example: '2025-05-01T04:50:53.655Z'
            additionalProperties: false
            minProperties: 1
responses:
  '200':
    description: Successfully updated user information
    content:
      application/json:
        schema:
          type: object
          $ref: ../../components/schemas/user.yaml
  '400':
    $ref: ../../components/responses/400.yaml
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
